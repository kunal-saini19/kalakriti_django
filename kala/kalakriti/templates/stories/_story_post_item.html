<article class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4 mb-3">
        <div>
            <h3 class="font-semibold text-brown-dark">{{ post.user.first_name|default:post.user.username }}</h3>
            <p class="text-xs text-gray-500">@{{ post.user.username }} • {{ post.created_at|timesince }} ago</p>
        </div>
        <span class="text-xs px-3 py-1 rounded-full bg-indiaOrange/10 text-indiaOrange">Story</span>
    </div>

    <p class="text-gray-800 leading-relaxed whitespace-pre-wrap">{{ post.content }}</p>
</article>
