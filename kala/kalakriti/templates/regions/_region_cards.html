{% if regions %}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for region in regions %}
        <a href="{% url 'kalakriti:region_detail' region.slug %}" class="group relative overflow-hidden rounded-lg h-80 cursor-pointer">
            {% if region.image %}
                <img src="{{ region.image.url }}" alt="{{ region.name }}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
            {% else %}
                <div class="w-full h-full bg-gray-300 flex items-center justify-center">
                    <i class="fas fa-image text-gray-500 text-6xl"></i>
                </div>
            {% endif %}
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent group-hover:from-black/90 transition-all duration-300 flex flex-col items-end justify-end p-6">
                <h3 class="text-white font-bold text-2xl mb-2">{{ region.name }}</h3>
                <p class="text-white/90 text-sm">{{ region.description|truncatewords:20 }}</p>
                <div class="mt-3 text-indiaOrange font-semibold">Explore →</div>
            </div>
        </a>
        {% endfor %}
    </div>
{% else %}
    <div class="text-center py-16">
        <i class="fas fa-map text-6xl text-gray-300 mb-4"></i>
        <p class="text-gray-600 text-lg">No regions found</p>
    </div>
{% endif %}
